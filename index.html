<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DILO – Asistente Virtual D'LOGIA</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,400&display=swap" rel="stylesheet" />
  <style>
    /* ─── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #09090e;
      --surface:   #111118;
      --surface2:  #1a1a26;
      --border:    #2a2a3a;
      --accent:    #6c63ff;
      --accent-dim:#4f47cc;
      --teal:      #00d4aa;
      --teal-dim:  #00a885;
      --text:      #e8e8f0;
      --text-muted:#8888aa;
      --bubble-user: #6c63ff;
      --bubble-bot:  #1a1a26;
      --radius:    16px;
      --font-head: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      font-size: 15px;
      line-height: 1.6;
      overflow: hidden;
    }

    /* ─── Layout ────────────────────────────────────────────────── */
    #app {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      max-width: 800px;
      margin: 0 auto;
    }

    /* ─── Header ────────────────────────────────────────────────── */
    header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 24px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .logo-wrap {
      position: relative;
      width: 42px;
      height: 42px;
      flex-shrink: 0;
    }

    .logo-wrap img {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--accent);
    }

    .status-dot {
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 11px;
      height: 11px;
      background: var(--teal);
      border-radius: 50%;
      border: 2px solid var(--surface);
      animation: pulse-dot 2.5s ease-in-out infinite;
    }

    @keyframes pulse-dot {
      0%, 100% { box-shadow: 0 0 0 0 rgba(0, 212, 170, 0.5); }
      50%       { box-shadow: 0 0 0 6px rgba(0, 212, 170, 0); }
    }

    .header-info h1 {
      font-family: var(--font-head);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      line-height: 1.2;
    }

    .header-info h1 span { color: var(--accent); }

    .header-info p {
      font-size: 0.75rem;
      color: var(--teal);
      font-weight: 500;
      letter-spacing: 0.04em;
    }

    .header-actions {
      margin-left: auto;
      display: flex;
      gap: 10px;
    }

    .btn-icon {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-radius: 10px;
      padding: 7px 10px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--border);
      color: var(--text);
    }

    /* ─── Messages Area ─────────────────────────────────────────── */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px 10px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }

    #messages::-webkit-scrollbar { width: 4px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    /* ─── Welcome Screen ─────────────────────────────────────────── */
    #welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      flex: 1;
      text-align: center;
      padding: 40px 20px;
    }

    .welcome-icon {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--teal));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin-bottom: 20px;
      box-shadow: 0 0 40px rgba(108, 99, 255, 0.3);
    }

    #welcome h2 {
      font-family: var(--font-head);
      font-size: 1.6rem;
      font-weight: 800;
      margin-bottom: 10px;
      background: linear-gradient(135deg, var(--text) 30%, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    #welcome p {
      color: var(--text-muted);
      font-size: 0.9rem;
      max-width: 380px;
      line-height: 1.7;
    }

    /* ─── Suggestion Chips ───────────────────────────────────────── */
    .chips-wrapper {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      max-width: 520px;
    }

    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 50px;
      padding: 8px 16px;
      font-size: 0.82rem;
      font-family: var(--font-body);
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .chip:hover {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(108, 99, 255, 0.35);
    }

    /* ─── Message Bubbles ────────────────────────────────────────── */
    .msg {
      display: flex;
      gap: 10px;
      max-width: 88%;
      animation: fade-up 0.3s ease;
    }

    @keyframes fade-up {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .msg.bot {
      align-self: flex-start;
    }

    .avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
      margin-top: 2px;
    }

    .msg.user .avatar {
      background: linear-gradient(135deg, var(--accent-dim), var(--accent));
      color: #fff;
    }

    .msg.bot .avatar {
      background: linear-gradient(135deg, var(--teal-dim), var(--teal));
      color: #fff;
    }

    .bubble {
      padding: 11px 16px;
      border-radius: var(--radius);
      font-size: 0.9rem;
      line-height: 1.65;
      max-width: 100%;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: var(--bubble-user);
      color: #fff;
      border-bottom-right-radius: 4px;
      box-shadow: 0 2px 12px rgba(108, 99, 255, 0.25);
    }

    .msg.bot .bubble {
      background: var(--bubble-bot);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble p { margin: 0; }
    .bubble strong { color: #fff; font-weight: 600; }
    .msg.user .bubble strong { color: #fff; }
    .msg.bot .bubble strong { color: var(--text); }
    .bubble ul, .bubble ol { margin: 6px 0 6px 18px; padding: 0; }
    .bubble li { margin: 3px 0; }
    .bubble em { opacity: 0.9; font-style: italic; }
    .bubble br + br { display: none; }

    /* ─── Typing Indicator ───────────────────────────────────────── */
    #typing-indicator {
      display: none;
      align-self: flex-start;
      align-items: center;
      gap: 10px;
      animation: fade-up 0.3s ease;
    }

    #typing-indicator .avatar {
      background: linear-gradient(135deg, var(--teal-dim), var(--teal));
      color: #fff;
    }

    .dots {
      display: flex;
      gap: 5px;
      background: var(--bubble-bot);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-bottom-left-radius: 4px;
      padding: 13px 16px;
    }

    .dots span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s ease-in-out infinite;
    }

    .dots span:nth-child(2) { animation-delay: 0.2s; }
    .dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.4; }
      40%            { transform: translateY(-7px); opacity: 1; }
    }

    /* ─── Input Area ─────────────────────────────────────────────── */
    #input-area {
      padding: 16px 20px 20px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 10px 10px 10px 18px;
      transition: border-color 0.2s;
    }

    .input-row:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(108, 99, 255, 0.12);
    }

    #user-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text);
      font-family: var(--font-body);
      font-size: 0.9rem;
      resize: none;
      max-height: 120px;
      line-height: 1.5;
      padding: 2px 0;
      overflow-y: auto;
    }

    #user-input::placeholder { color: var(--text-muted); }
    #user-input::-webkit-scrollbar { width: 0; }

    #send-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--teal));
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: all 0.2s;
      opacity: 0.5;
    }

    #send-btn.active {
      opacity: 1;
      box-shadow: 0 4px 14px rgba(108, 99, 255, 0.4);
    }

    #send-btn.active:hover {
      transform: scale(1.06);
    }

    #send-btn svg {
      width: 16px;
      height: 16px;
      fill: none;
      stroke: #fff;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .input-footer {
      margin-top: 10px;
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-muted);
    }

    /* ─── Typewriter cursor ──────────────────────────────────────── */
    .cursor {
      display: inline-block;
      width: 2px;
      height: 1em;
      background: var(--teal);
      margin-left: 2px;
      vertical-align: text-bottom;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0; }
    }

    /* ─── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 500px) {
      header { padding: 14px 16px; }
      #messages { padding: 16px 14px 8px; }
      #input-area { padding: 12px 14px 16px; }
    }
  </style>
</head>
<body>
<div id="app">

  <!-- Header -->
  <header>
    <div class="logo-wrap">
      <img src="/images/logo-dlogia.png" alt="D'LOGIA" onerror="this.style.display='none'; this.parentElement.querySelector('.fallback-logo').style.display='flex';" />
      <div class="fallback-logo" style="display:none; width:42px; height:42px; border-radius:50%; background:linear-gradient(135deg,#6c63ff,#00d4aa); align-items:center; justify-content:center; font-family:'Syne',sans-serif; font-weight:800; font-size:0.75rem; color:#fff; border:2px solid #6c63ff;">DL</div>
      <div class="status-dot"></div>
    </div>
    <div class="header-info">
      <h1>DILO <span>·</span> D'LOGIA</h1>
      <p>En línea · Asistente Virtual</p>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="clearChat()" title="Nueva conversación">↺ Nueva</button>
    </div>
  </header>

  <!-- Messages -->
  <div id="messages">
    <!-- Welcome screen -->
    <div id="welcome">
      <div class="welcome-icon">🤖</div>
      <h2>¡Hola! Soy DILO</h2>
      <p>El asistente virtual de <strong>D'LOGIA</strong>. Estoy aquí para ayudarte con nuestros servicios de automatización, IA y soluciones empresariales.</p>
      <div class="chips-wrapper">
        <button class="chip" onclick="sendChip('¿Qué servicios ofrece D\'LOGIA?')">¿Qué servicios ofrecen?</button>
        <button class="chip" onclick="sendChip('¿Cómo puedo automatizar mi negocio?')">Automatizar mi negocio</button>
        <button class="chip" onclick="sendChip('Quiero hablar con un asesor')">Hablar con un asesor</button>
        <button class="chip" onclick="sendChip('¿Cuáles son sus precios?')">Ver precios</button>
        <button class="chip" onclick="sendChip('¿Cómo implementan inteligencia artificial?')">Proyectos de IA</button>
        <button class="chip" onclick="sendChip('Quiero registrar mi interés en D\'LOGIA')">Registrar mi interés</button>
      </div>
    </div>

    <!-- Typing indicator (hidden by default) -->
    <div id="typing-indicator" style="display:none; align-self:flex-start; gap:10px;" class="msg bot">
      <div class="avatar">DL</div>
      <div class="dots">
        <span></span><span></span><span></span>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div id="input-area">
    <div class="input-row">
      <textarea
        id="user-input"
        placeholder="Escríbeme algo..."
        rows="1"
        autocomplete="off"
        spellcheck="false"
      ></textarea>
      <button id="send-btn" onclick="sendMessage()" title="Enviar">
        <svg viewBox="0 0 24 24">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </div>
    <p class="input-footer">D'LOGIA · Soluciones empresariales inteligentes</p>
  </div>

</div>

<script>
  // ── State ──────────────────────────────────────────────────────────
  let threadId = localStorage.getItem('dilo_thread_id') || null;
  let isLoading = false;

  // ── DOM refs ───────────────────────────────────────────────────────
  const messagesEl  = document.getElementById('messages');
  const inputEl     = document.getElementById('user-input');
  const sendBtn     = document.getElementById('send-btn');
  const typingEl    = document.getElementById('typing-indicator');
  const welcomeEl   = document.getElementById('welcome');

  // ── Auto-grow textarea ─────────────────────────────────────────────
  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    sendBtn.classList.toggle('active', inputEl.value.trim().length > 0);
  });

  inputEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      if (!isLoading && inputEl.value.trim()) sendMessage();
    }
  });

  // ── Helpers ────────────────────────────────────────────────────────
  function hideWelcome() {
    if (welcomeEl) welcomeEl.remove();
  }

  function scrollBottom() {
    requestAnimationFrame(() => {
      messagesEl.scrollTop = messagesEl.scrollHeight;
    });
  }

  function showTyping() {
    typingEl.style.display = 'flex';
    messagesEl.appendChild(typingEl);
    scrollBottom();
  }

  function hideTyping() {
    typingEl.style.display = 'none';
  }

  function addMessage(text, role) {
    hideWelcome();

    const wrap = document.createElement('div');
    wrap.className = `msg ${role}`;

    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = role === 'user' ? 'Tú' : 'DL';

    const bubble = document.createElement('div');
    bubble.className = 'bubble';

    wrap.appendChild(avatar);
    wrap.appendChild(bubble);

    // Insert before typing indicator
    messagesEl.insertBefore(wrap, typingEl);
    scrollBottom();

    return bubble;
  }

  // ── Markdown → HTML ───────────────────────────────────────────────
  function parseMarkdown(text) {
    // Escape HTML first
    let html = text
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');

    // Bold **text** / __text__
    html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
    html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');

    // Italic *text* / _text_
    html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
    html = html.replace(/_(.+?)_/g, '<em>$1</em>');

    // Inline code `code`
    html = html.replace(/`([^`]+)`/g, '<code style="background:rgba(108,99,255,0.15);padding:1px 5px;border-radius:4px;font-family:monospace;font-size:0.85em;">$1</code>');

    // Unordered lists: lines starting with - or *
    html = html.replace(/^[ \t]*[-*]\s+(.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>(\n|$))+/gs, match => `<ul style="margin:6px 0 6px 18px;padding:0;">${match}</ul>`);

    // Numbered lists: lines starting with 1. 2. etc.
    html = html.replace(/^[ \t]*\d+\.\s+(.+)$/gm, '<li>$1</li>');
    html = html.replace(/(<li>.*<\/li>(\n|$))+/gs, match => {
      if (match.includes('<ul')) return match;
      return `<ol style="margin:6px 0 6px 18px;padding:0;">${match}</ol>`;
    });

    // Line breaks
    html = html.replace(/\n/g, '<br>');

    return html;
  }

  // ── Typewriter effect ──────────────────────────────────────────────
  function typewrite(bubble, text, speed = 14) {
    return new Promise(resolve => {
      // Show plain text char-by-char, then swap to rendered HTML at the end
      bubble.innerHTML = '';
      const cursor = document.createElement('span');
      cursor.className = 'cursor';
      bubble.appendChild(cursor);

      let i = 0;
      function tick() {
        if (i >= text.length) {
          // Replace plain text with rendered markdown
          cursor.remove();
          bubble.innerHTML = parseMarkdown(text);
          resolve();
          return;
        }

        bubble.insertBefore(document.createTextNode(text[i]), cursor);
        i++;
        scrollBottom();

        const ch = text[i - 1];
        const delay = '.!?\n'.includes(ch) ? 160 : ','.includes(ch) ? 80 : speed;
        setTimeout(tick, delay);
      }

      tick();
    });
  }

  // ── Send message ───────────────────────────────────────────────────
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || isLoading) return;

    isLoading = true;
    inputEl.value = '';
    inputEl.style.height = 'auto';
    sendBtn.classList.remove('active');
    inputEl.disabled = true;

    addMessage(text, 'user').textContent = text;
    showTyping();
    scrollBottom();

    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ prompt: text, thread_id: threadId }),
      });

      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Error ${res.status}`);
      }

      const data = await res.json();
      threadId = data.thread_id;
      localStorage.setItem('dilo_thread_id', threadId);

      hideTyping();
      const bubble = addMessage('', 'bot');
      await typewrite(bubble, data.response);

    } catch (err) {
      hideTyping();
      const bubble = addMessage('', 'bot');
      bubble.style.borderColor = '#ff6b6b';
      bubble.textContent = `⚠️ ${err.message || 'No se pudo conectar con el servidor.'}`;
    } finally {
      isLoading = false;
      inputEl.disabled = false;
      inputEl.focus();
    }
  }

  // ── Chip shortcuts ─────────────────────────────────────────────────
  function sendChip(text) {
    inputEl.value = text;
    sendBtn.classList.add('active');
    sendMessage();
  }

  // ── Clear / New chat ───────────────────────────────────────────────
  function clearChat() {
    if (isLoading) return;
    threadId = null;
    localStorage.removeItem('dilo_thread_id');

    // Remove all message nodes except typing indicator
    Array.from(messagesEl.children).forEach(child => {
      if (child.id !== 'typing-indicator') child.remove();
    });

    // Re-insert welcome
    const welcome = document.createElement('div');
    welcome.id = 'welcome';
    welcome.innerHTML = `
      <div class="welcome-icon">🤖</div>
      <h2>¡Hola! Soy DILO</h2>
      <p>El asistente virtual de <strong>D'LOGIA</strong>. Estoy aquí para ayudarte con nuestros servicios de automatización, IA y soluciones empresariales.</p>
      <div class="chips-wrapper">
        <button class="chip" onclick="sendChip('¿Qué servicios ofrece D\\'LOGIA?')">¿Qué servicios ofrecen?</button>
        <button class="chip" onclick="sendChip('¿Cómo puedo automatizar mi negocio?')">Automatizar mi negocio</button>
        <button class="chip" onclick="sendChip('Quiero hablar con un asesor')">Hablar con un asesor</button>
        <button class="chip" onclick="sendChip('¿Cuáles son sus precios?')">Ver precios</button>
        <button class="chip" onclick="sendChip('¿Cómo implementan inteligencia artificial?')">Proyectos de IA</button>
        <button class="chip" onclick="sendChip('Quiero registrar mi interés en D\\'LOGIA')">Registrar mi interés</button>
      </div>`;
    messagesEl.insertBefore(welcome, typingEl);
  }

  // ── Init ───────────────────────────────────────────────────────────
  inputEl.focus();
</script>
</body>
</html>
